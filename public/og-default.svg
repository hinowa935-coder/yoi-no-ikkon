  <circle cx="104" cy="96" r="2" fill="#d8bd7a" opacity=".62"/>
  <circle cx="1037" cy="178" r="2" fill="#d8bd7a" opacity=".48"/>
  <circle cx="956" cy="512" r="1.4" fill="#d8bd7a" opacity=".56"/>
  <g transform="translate(116 122) scale(1.35)">
